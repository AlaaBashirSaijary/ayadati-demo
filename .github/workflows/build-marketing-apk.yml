name: Build marketing demo APK

# Manual only: Actions tab -> "Build marketing demo APK" -> Run workflow, then
# type the marketer's name and the number of days. Never runs on push.
on:
  workflow_dispatch:
    inputs:
      holder:
        description: "Marketer name (shown on the ribbon inside the app)"
        required: true
        type: string
      days:
        description: "Days the build stays valid"
        required: true
        default: "30"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.9"
          channel: stable

      - run: flutter pub get

      # No signing secrets and no GEMINI_API_KEY: this repository holds
      # nothing secret. The APK is debug-signed with a different package id
      # (...demo), so it can neither replace nor update the real app.
      - name: Build the demo APK
        env:
          HOLDER: ${{ inputs.holder }}
          DAYS: ${{ inputs.days }}
        run: |
          EXPIRY=$(date -u -d "+${DAYS} days" +%Y-%m-%d)
          echo "EXPIRY=$EXPIRY" >> "$GITHUB_ENV"
          flutter build apk --release --obfuscate --split-debug-info=build/marketing-symbols \
            --dart-define=MARKETING_EXPIRY="$EXPIRY" \
            --dart-define="MARKETING_HOLDER=$HOLDER"
          cp build/app/outputs/flutter-apk/app-release.apk "ayadati-demo-$EXPIRY.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ayadati-demo-${{ env.EXPIRY }}
          path: ayadati-demo-*.apk
          retention-days: 30
